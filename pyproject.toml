[project]
name = "isaac-acp"
version = "0.4.0"
description = "Pydantic AI Harness coding agent served over ACP."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Isaac Contributors" }]
requires-python = ">=3.11"
keywords = ["acp", "agent-client-protocol", "agent", "coding", "pydantic-ai-harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "agent-client-protocol>=0.11.1,<0.12.0",
    "pydantic-ai-slim[anthropic,google,mcp,openai]>=2.69.0,<3.0.0",
    "pydantic-ai-harness[acp,coder,code-mode,skills]>=0.69.0,<0.70.0",
    "fastmcp-slim>=4.2.0,<5.0.0",
    "python-dotenv==1.2.4",
    "platformdirs==4.14.5",
]

[project.urls]
Homepage = "https://github.com/gbtami/isaac"
Repository = "https://github.com/gbtami/isaac"
Issues = "https://github.com/gbtami/isaac/issues"
ACP-Spec = "https://agentclientprotocol.com/protocol/"

[project.scripts]
isaac = "isaac.cli:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "mypy",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/isaac"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
